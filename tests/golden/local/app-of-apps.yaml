---
# Source: app-of-apps/templates/application.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cerberus-local
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: clickhouse-observability-stack
    environment: local
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/brandonapol/clickhouse-observability-stack.git
    targetRevision: main
    path: cluster-nodes/cerberus
    helm:
      releaseName: cerberus
      valuesObject:
        global:
          labels:
            environment: local
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
---
# Source: app-of-apps/templates/application.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: clickhouse-local
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: clickhouse-observability-stack
    environment: local
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/brandonapol/clickhouse-observability-stack.git
    targetRevision: main
    path: cluster-nodes/clickhouse
    helm:
      releaseName: clickhouse
      valuesObject:
        global:
          labels:
            environment: local
        secrets:
          credentials:
            create: true
            stringData:
              password: otel-local-dev
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
