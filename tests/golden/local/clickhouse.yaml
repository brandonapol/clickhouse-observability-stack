---
# Source: clickhouse/templates/common.yaml
apiVersion: v1
kind: Secret
metadata:
  name: clickhouse-credentials
  namespace: observability
  labels:
    app.kubernetes.io/name: clickhouse
    app.kubernetes.io/instance: clickhouse
    app.kubernetes.io/part-of: clickhouse-observability-stack
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: clickhouse-0.1.0
    app.kubernetes.io/version: "26.9.5.2"
    environment: local
type: Opaque
stringData:
  password: "otel-local-dev"
  username: "otel"
---
# Source: clickhouse/templates/common.yaml
apiVersion: clickhouse.altinity.com/v1
kind: ClickHouseInstallation
metadata:
  labels:
    app.kubernetes.io/instance: clickhouse
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: clickhouse
    app.kubernetes.io/part-of: clickhouse-observability-stack
    app.kubernetes.io/version: 26.9.5.2
    environment: local
    helm.sh/chart: clickhouse-0.1.0
  name: otel
  namespace: observability
spec:
  configuration:
    clusters:
    - layout:
        replicasCount: 1
        shardsCount: 1
      name: main
    files:
      config.d/low_memory.xml: |
        <clickhouse>
          <max_server_memory_usage_to_ram_ratio>0.75</max_server_memory_usage_to_ram_ratio>
          <mark_cache_size>67108864</mark_cache_size>
          <uncompressed_cache_size>0</uncompressed_cache_size>
          <index_mark_cache_size>0</index_mark_cache_size>
          <index_uncompressed_cache_size>0</index_uncompressed_cache_size>
          <background_schedule_pool_size>8</background_schedule_pool_size>
          <background_common_pool_size>4</background_common_pool_size>
          <background_fetches_pool_size>2</background_fetches_pool_size>
          <background_move_pool_size>2</background_move_pool_size>
          <background_buffer_flush_schedule_pool_size>2</background_buffer_flush_schedule_pool_size>
          <background_distributed_schedule_pool_size>2</background_distributed_schedule_pool_size>
          <background_message_broker_schedule_pool_size>2</background_message_broker_schedule_pool_size>
          <asynchronous_metric_log remove="1"/>
          <metric_log remove="1"/>
          <query_metric_log remove="1"/>
          <trace_log remove="1"/>
          <text_log remove="1"/>
          <part_log remove="1"/>
          <processors_profile_log remove="1"/>
          <opentelemetry_span_log remove="1"/>
          <latency_log remove="1"/>
          <error_log remove="1"/>
          <query_thread_log remove="1"/>
          <query_views_log remove="1"/>
          <session_log remove="1"/>
          <blob_storage_log remove="1"/>
        </clickhouse>
    profiles:
      default/max_memory_usage: 536870912
      default/max_threads: 2
    users:
      otel/networks/ip:
      - 0.0.0.0/0
      - ::/0
      otel/password:
        valueFrom:
          secretKeyRef:
            key: password
            name: clickhouse-credentials
      otel/profile: default
      otel/quota: default
  defaults:
    templates:
      dataVolumeClaimTemplate: data
      podTemplate: clickhouse
      serviceTemplate: clickhouse
  templates:
    podTemplates:
    - name: clickhouse
      spec:
        containers:
        - image: clickhouse/clickhouse-server:26.9.5.2
          name: clickhouse
          resources:
            limits:
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 256Mi
    serviceTemplates:
    - generateName: clickhouse
      name: clickhouse
      spec:
        ports:
        - name: http
          port: 8123
        - name: tcp
          port: 9000
        type: ClusterIP
    volumeClaimTemplates:
    - name: data
      spec:
        accessModes:
        - ReadWriteOnce
        resources:
          requests:
            storage: 2Gi
