spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: clickhouse-operator
      app.kubernetes.io/instance: clickhouse-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: clickhouse-operator
        app.kubernetes.io/instance: clickhouse-operator
      annotations:
        checksum/config: 669ef126cc0ac1e219edf21c4ca3ad6e647f27935b23ef6015983e1ac7919c31
    spec:
      serviceAccountName: clickhouse-operator
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 30
      containers:
        - name: clickhouse-operator
          image: "altinity/clickhouse-operator:0.27.4"
          imagePullPolicy: IfNotPresent
          ports:
            - name: op-metrics
              containerPort: 9999
              protocol: TCP
          env:
            - name: OPERATOR_CONTAINER_CPU_LIMIT
              valueFrom:
                resourceFieldRef:
                  divisor: 1m
                  resource: limits.cpu
            - name: OPERATOR_CONTAINER_CPU_REQUEST
