apiVersion: v1
kind: ConfigMap
metadata:
  name: clickhouse-operator-chk-configd
  namespace: clickhouse-operator
  labels:
    app.kubernetes.io/name: clickhouse-operator
    app.kubernetes.io/instance: clickhouse-operator
    app.kubernetes.io/part-of: clickhouse-observability-stack
