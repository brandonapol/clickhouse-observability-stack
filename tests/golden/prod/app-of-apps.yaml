apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: clickhouse-operator-prod
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: clickhouse-observability-stack
    environment: prod
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/brandonapol/clickhouse-observability-stack.git
    targetRevision: main
    path: cluster-nodes/clickhouse-operator
    helm:
      releaseName: clickhouse-operator
      valuesObject:
        deployment:
          containers:
            clickhouse-operator:
              resources:
                limits:
                  memory: 512Mi
                requests:
                  cpu: 100m
                  memory: 128Mi
        global:
          labels:
            environment: prod
        secrets:
          credentials:
            create: false
  destination:
    server: https://kubernetes.default.svc
    namespace: clickhouse-operator
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
