---
# Source: clickhouse/templates/common.yaml
apiVersion: clickhouse.altinity.com/v1
kind: ClickHouseInstallation
metadata:
  labels:
    app.kubernetes.io/instance: clickhouse
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: clickhouse
    app.kubernetes.io/part-of: clickhouse-observability-stack
    app.kubernetes.io/version: 26.9.5.2
    environment: prod
    helm.sh/chart: clickhouse-0.1.0
  name: otel
  namespace: observability
spec:
  configuration:
    clusters:
    - layout:
        replicasCount: 1
        shardsCount: 1
      name: main
    users:
      otel/networks/ip:
      - 0.0.0.0/0
      - ::/0
      otel/password:
        valueFrom:
          secretKeyRef:
            key: password
            name: clickhouse-credentials
      otel/profile: default
      otel/quota: default
  defaults:
    templates:
      dataVolumeClaimTemplate: data
      podTemplate: clickhouse
      serviceTemplate: clickhouse
  templates:
    podTemplates:
    - name: clickhouse
      spec:
        containers:
        - image: clickhouse/clickhouse-server:26.9.5.2
          name: clickhouse
          resources:
            limits:
              memory: 8Gi
            requests:
              cpu: "2"
              memory: 8Gi
    serviceTemplates:
    - generateName: clickhouse
      name: clickhouse
      spec:
        ports:
        - name: http
          port: 8123
        - name: tcp
          port: 9000
        type: ClusterIP
    volumeClaimTemplates:
    - name: data
      spec:
        accessModes:
        - ReadWriteOnce
        resources:
          requests:
            storage: 200Gi
