# Minimal Argo CD for a local cluster (chart argo/argo-cd).
# Installed by scripts/kind-up.sh; everything else is deployed by Argo CD itself.
dex:
  enabled: false
notifications:
  enabled: false
applicationSet:
  replicas: 1

configs:
  params:
    server.insecure: true          # plain HTTP behind kubectl port-forward
  cm:
    # Argo CD doesn't report child Application health by default, which makes
    # sync waves in an app-of-apps meaningless. This restores it, so each wave
    # waits for the previous apps to be Healthy.
    resource.customizations.health.argoproj.io_Application: |
      hs = { status = "Progressing", message = "" }
      -- A newly created Application briefly reports Healthy before its first
      -- sync (it has no resources yet), so also require it to be Synced.
      if obj.status ~= nil and obj.status.health ~= nil and obj.status.sync ~= nil then
        if obj.status.sync.status == "Synced" then
          hs.status = obj.status.health.status
        end
        if obj.status.health.message ~= nil then
          hs.message = obj.status.health.message
        end
      end
      return hs
    # Treat a ClickHouseInstallation as Healthy only once the operator has
    # finished reconciling it, so Cerberus doesn't start before ClickHouse exists.
    resource.customizations.health.clickhouse.altinity.com_ClickHouseInstallation: |
      hs = { status = "Progressing", message = "waiting for operator" }
      if obj.status ~= nil and obj.status.status ~= nil then
        hs.message = obj.status.status
        if obj.status.status == "Completed" then
          hs.status = "Healthy"
        end
      end
      return hs

controller:
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 512Mi }
repoServer:
  resources:
    requests: { cpu: 25m, memory: 64Mi }
    limits: { memory: 384Mi }
server:
  resources:
    requests: { cpu: 25m, memory: 48Mi }
    limits: { memory: 256Mi }
redis:
  resources:
    requests: { cpu: 10m, memory: 16Mi }
    limits: { memory: 64Mi }
